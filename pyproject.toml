[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gait-stability"
version = "0.1.0"
description = "Research pipeline for video-derived gait stability candidates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-contrib-python-headless>=5.0,<5.1",
]

[project.optional-dependencies]
pose = [
    "absl-py~=2.3",
    "certifi",
    "flatbuffers~=25.9",
    "matplotlib",
    "sounddevice~=0.5",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]
ignore_missing_imports = true
